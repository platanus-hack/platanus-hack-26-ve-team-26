<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tridi · física</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>Unitree G1 en MuJoCo</h1>
        <p>La física corre en tu navegador. Con la cámara, el robot copia tu movimiento; sin ella, sostiene la pose con sus motores y todavía no tiene política para equilibrarse.</p>
      </div>
      <nav>
        <button id="camera" disabled>Cámara</button>
        <button id="clip" disabled>Caminata</button>
        <select id="policy" disabled aria-label="Política">
          <option value="">Sin política (motores rígidos)</option>
          <option value="g1-stand-step-0">Política sin entrenar (paso 0)</option>
          <option value="g1-stand-step-3000000">3 M de pasos</option>
          <option value="g1-stand-step-10000000">10 M de pasos</option>
          <option value="g1-stand">20 M de pasos (final)</option>
        </select>
        <button id="push" disabled>Empujar</button>
        <button id="reset" disabled>Reiniciar</button>
      </nav>
    </header>
    <main id="stage">
      <canvas id="view"></canvas>
      <div id="camera-box" hidden>
        <video id="camera-video" playsinline muted></video>
        <canvas id="camera-overlay"></canvas>
      </div>
      <div id="loading">
        <div class="track"><div id="progress-bar"></div></div>
        <p id="progress-text">Cargando MuJoCo y el robot…</p>
      </div>
    </main>
    <footer><span id="stats"></span><span id="camera-stats"></span></footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
